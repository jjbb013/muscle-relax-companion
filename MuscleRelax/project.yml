name: MuscleRelax
options:
  bundleIdPrefix: com.will.musclerelax
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  MuscleRelax:
    type: application
    platform: iOS
    sources:
      - path: MuscleRelax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.will.musclerelax.app
        PRODUCT_NAME: 肌肉放松沟通助手
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 肌肉放松沟通助手
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于语音输入描述身体状态，识别仅在设备本地完成，不会上传任何音频。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 用于将语音转为文字，识别仅在设备本地完成，不会上传任何数据。
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MuscleRelax/MuscleRelax.entitlements
      configs:
        Debug:
          SWIFT_STRICT_CONCURRENCY: minimal
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
